name: "OpenA2A Trust Gate"
description: "Retired: this action checks no dependencies and exits 1. Use the audit command of ai-trust in its place."

runs:
  using: "composite"
  steps:
    - name: Trust gate is retired
      shell: bash
      run: |
        echo "::error title=trust-gate is retired::This action checks no dependencies. Replace the opena2a-org/trust-gate step with the audit command of ai-trust: https://github.com/opena2a-org/ai-trust#gate-a-projects-ai-dependencies-in-ci"
        exit 1

branding:
  icon: "shield"
  color: "blue"
